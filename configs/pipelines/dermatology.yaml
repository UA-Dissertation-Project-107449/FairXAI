# Dermatology pipeline configuration (PAD-UFES baseline)

paths:
  external_dir: data/external/dermatology
  raw_dir: data/raw/dermatology
  processed_dir: data/processed/dermatology

runtime:
  datasets: [pad_ufes_20]
  schema_mapping_json: configs/schema/dermatology.json

split:
  test_size: 0.3
  random_state: 42
  group_column: patient_id

training:
  modality: image
  target: skin_cancer
  model: resnet18
  model_types: [resnet18, mobilenet_v3_large, efficientnet_b0, densenet121]
  training_methods: [single_split]
  thresholds: [0.5]
  use_hpo: false
  image:
    image_column: image_path
    device: auto      # auto probes cuda -> rocm -> cpu
    epochs: 50        # Epoch cap, not a target (early stopping decides the real length per model)
    batch_size: 32
    learning_rate: 0.0003
    image_size: 224
    pretrained: true
    freeze_backbone: true
    # Per-DataLoader worker count (the augmentation path keeps several loaders alive).
    num_workers: 2
    # Frozen-backbone speedup: cache features once, train only the head (auto-off if unfrozen).
    cache_frozen_features: true
    # Train-only smartphone-robustness aug; forces feature cache off; brightness/contrast only (no hue/sat).
    use_augmentation: true
    augmentation:
      crop_scale_min: 0.7    # RandomResizedCrop lower bound (also fixes square-squish)
      rotation_degrees: 20   # phone orientation jitter
      blur_prob: 0.2         # p of mild GaussianBlur (out-of-focus phone shots)
      brightness: 0.2        # exposure variance
      contrast: 0.2          # exposure variance
    # Train to convergence; best-val_auc weights restored on stop (val slice never feeds test metric).
    early_stopping:
      enabled: true
      monitor: val_auc
      patience: 5
      min_delta: 0.001
      val_fraction: 0.15

profiling:
  # Stage 2 (profile): extra sensitive attributes profiled where present but kept
  # out of fairness.sensitive_attributes (PAD has no race; SCIN does). SCIN is
  # profiling-only, so race fairness here = data-fairness (support / missingness /
  # prevalence over the approximate skin_cancer proxy), not prediction fairness.
  extra_sensitive_attributes: [race_group]

fairness:
  sensitive_attributes: [age_group, sex, fitzpatrick_group]
  # Stage 8 (assess): groups with fewer than this many test rows are dropped from
  # group-fairness metrics and reported under skipped_groups (avoids claims on
  # tiny cells, e.g. PAD Fitzpatrick V-VI). Override per run with --min-group-samples.
  min_group_samples: 50
  # Stage 8 (assess): render subgroup-performance heatmaps (and per-view intersection
  # figures when group_views is enabled) from the saved per-group metrics. No retraining.
  figures: true
  group_views:
    # Stage 8 add-on: recompute fairness over post-hoc subgroup definitions from
    # saved prediction CSVs. No retraining; canonical fairness_report.json is unchanged.
    enabled: true
    min_group_samples: 50
    intersection_min_group_samples: 30
    views: [age_coarse, sex, fitzpatrick_group, sex_x_fitzpatrick, age_coarse_x_fitzpatrick]

readiness_figures:
  # Stage 4 (preprocess): render dissertation-ready data-validity figures from the
  # split-aware data-fairness profile. Override per run with --figures / --no-figures.
  enabled: true
  split: test
  outputs: [subgroup_support, target_prevalence]

comparison:
  # Stage 9 (compare): render dissertation-ready PNGs from existing baseline
  # metrics/fairness outputs. Override per run with --figures / --no-figures.
  figures: true

xai:
  # Stage 10 (explain): post-hoc saliency for trained CNNs. Reloads each model
  # checkpoint and writes SHAP / LIME / Grad-CAM overlays for a small set of test
  # images stratified by sensitive group x outcome (TP/FP/TN/FN). No retraining.
  enabled: true
  cv_enabled: false
  # Per-method toggles (all on to start; flip individually if LIME/SHAP are slow).
  shap: true
  lime: true
  gradcam: true
  n_samples: 12          # images explained per model
  per_cell: 1            # images per (sensitive group, outcome) stratum before budget
  lime_num_samples: 1000 # LIME perturbations per image (lower = faster, noisier)

mitigation:
  # Stage 11 (mitigate), part 1: post-processing. Group-wise decision thresholds via
  # fairlearn ThresholdOptimizer, fit on saved train predictions and applied to
  # test predictions. Per sensitive attribute in isolation, every constraint
  # reported side-by-side. No retraining; no model load.
  # Part 2 (pre/in-processing) lives in the feature_space block below.
  enabled: true
  objective: balanced_accuracy_score
  min_group_samples: 50
  # Render baseline-vs-mitigated fairness-delta figures per attribute x constraint.
  figures: true
  # Defaults to fairness.sensitive_attributes when omitted.
  sensitive_attributes: [age_group, sex, fitzpatrick_group]
  constraints:
    - demographic_parity
    - equalized_odds
    - true_positive_rate_parity
    - false_positive_rate_parity

  # Stage 11 part 2: pre/in-processing mitigation on the frozen-backbone feature
  # matrix. freeze_backbone makes training a linear head over a fixed matrix, i.e.
  # a tabular problem, so the SAME MitigationEngine cardiac uses applies here — the
  # two domains then run technique-for-technique instead of differently-shaped
  # selections. Features are rebuilt from each saved checkpoint with one eval-mode
  # forward pass (they are not persisted by training, and the augmentation path
  # never caches them), then standardised before any technique runs.
  # Caveat kept in every report: the intervention is on the HEAD, not on the
  # representation — backbone bias survives. See docs/architecture/decisions.md.
  feature_space:
    enabled: true
    # Mirrors configs/experiments/combinatorial.yaml. ros/rus stay excluded there
    # (no fairness guarantee, information loss) and stay excluded here.
    techniques:
      - reweighting
      - smote
      - adasyn
      - exponentiated_gradient
      - grid_search
    # Head family trained over the features. logistic_regression matches the
    # linear head the CNN itself uses, so the baseline arm is the closest
    # comparable classifier rather than a different model class.
    model_type: logistic_regression
    batch_size: 32
    num_workers: 2
    device: auto      # auto probes cuda -> rocm -> cpu, as training does

studies:
  skip: true

scheduling:
  mode: serial
